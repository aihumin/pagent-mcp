name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Check out release
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Validate release version
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  IS_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from 'node:fs';

                  const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
                  const tag = process.env.RELEASE_TAG;
                  if (tag !== version && tag !== `v${version}`) {
                    throw new Error(`Release tag ${tag} must match package.json version ${version} (with an optional v prefix).`);
                  }

                  const prerelease = version.includes('-');
                  if (prerelease !== (process.env.IS_PRERELEASE === 'true')) {
                    throw new Error('The GitHub prerelease setting must match whether the package version contains a prerelease suffix.');
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\n`);
                  NODE

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Publish
              env:
                  NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
              run: npm publish --access public --tag "$NPM_DIST_TAG"
